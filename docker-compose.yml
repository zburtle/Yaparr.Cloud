# Runs the service. It speaks plain http, so put your own reverse proxy in front of it for https and point the proxy at the port below.
#
#   1. docker compose up -d --build
#   2. docker compose exec cloud dotnet Yaparr.Cloud.dll accounts add sam
#   3. In your proxy, send your domain to http://127.0.0.1:8080 (or the port you set).
#
# Give your friends https://<your domain> as the server address, and the username and password that step 2 shows.
# Keep Service__BehindProxy=true while a proxy is in front: the caller's address then comes from its X-Forwarded-For.
# The proxy has to set that header itself (most do), or every caller looks like the proxy and shares one rate limit.

services:
  cloud:
    build: .
    restart: unless-stopped
    environment:
      Service__BehindProxy: "true"
      # Service__MaxBlobBytes: "536870912"   # the largest backup, in bytes (512 MiB); the proxy must allow bodies this big
      # Service__KeepVersions: "5"
      # Service__WritesPerHour: "12"
      # Service__RequestsPerMinute: "120"
    volumes:
      - cloud-data:/data                     # the accounts and every backup: this is what to back up
    # On this computer only (127.0.0.1) unless SERVICE_BIND says otherwise. 0.0.0.0 reaches it from other computers, as plain http,
    # so only on a network you trust. SERVICE_PORT changes the port.
    ports:
      - "${SERVICE_BIND:-127.0.0.1}:${SERVICE_PORT:-8080}:8080"
    # A proxy that runs in a container of its own cannot reach 127.0.0.1 of this computer. To put the service on the proxy's network instead,
    # create it once (docker network create proxy), list it here and under "networks:" below, and send the proxy to http://cloud:8080.
    # networks: [default, proxy]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cloud-data:

