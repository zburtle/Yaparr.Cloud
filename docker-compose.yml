# The backup server, with Caddy in front of it to give it https (Caddy gets and renews the certificate by itself).
#
#   1. Point a DNS name at this machine and open ports 80 and 443 to it (docs/setup-guide.md walks through it).
#   2. docker compose up -d --build
#   3. docker compose exec cloud dotnet Yaparr.Cloud.dll accounts add you@example.com
#
# DOMAIN is cloud.yaparr.com unless .env says otherwise. Caddy is a separate service, so with a reverse proxy of your own instead, start only the
# service: "docker compose up -d --build cloud", and point your proxy at http://127.0.0.1:8080 (see SERVICE_BIND and SERVICE_PORT in .env.example).
# Service__BehindProxy stays true either way: the caller's address then comes from the proxy's X-Forwarded-For, which Caddy sets itself.

services:
  cloud:
    # The image CI publishes for each commit of master (deploy.sh sets IMAGE_TAG to the commit). "build" is the fallback: with --build, or when there is no
    # such image (a branch, or a machine that cannot reach ghcr.io), the image is built here and given this same name.
    image: ghcr.io/zburtle/yaparr-cloud:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      Service__BehindProxy: "true"
      # Service__PublicUrl: "https://cloud.yaparr.com"      # this service's address, for the signup links from "codes add" (this is the default in appsettings.json)
      # Service__SignupPageUrl: "https://yaparr.com/signup"  # the website page the links open (this is the default)
      # Service__MaxBlobBytes: "536870912"   # the largest backup, in bytes (512 MiB); Caddy allows a little more than this
      # Service__KeepVersions: "3"      # the newest versions always kept ...
      # Service__KeepDays: "7"          # ... and the newest of each of this many days
      # Service__WritesPerHour: "12"
      # Service__RequestsPerMinute: "120"
    volumes:
      - cloud-data:/data                     # the accounts, the signup codes and every backup: this is what to back up
    expose:
      - "8080"
    # Also on this computer only (127.0.0.1), for a proxy of your own or for looking at it from the machine itself. 0.0.0.0 would reach it from other
    # computers as plain http, which is not what you want with Caddy in front. SERVICE_PORT changes the port.
    ports:
      - "${SERVICE_BIND:-127.0.0.1}:${SERVICE_PORT:-8080}:8080"
    healthcheck:
      # bash, not the image's /bin/sh (dash), which has no /dev/tcp; the image has neither curl nor wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      cloud:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"                # Caddy needs 80 and 443 reachable from the internet to get a certificate; change these only
      - "${HTTPS_PORT:-443}:443"             # when something in front forwards 80 and 443 to them
      - "${HTTPS_PORT:-443}:443/udp"         # http/3
    environment:
      DOMAIN: ${DOMAIN:-cloud.yaparr.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                     # the certificates: keep this, or Let's Encrypt is asked for new ones on every start
      - caddy-config:/config

volumes:
  cloud-data:
  caddy-data:
  caddy-config:
