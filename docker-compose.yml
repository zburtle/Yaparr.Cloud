# The backup server, with Caddy in front of it to give it https (Caddy gets and renews the certificate by itself).
#
#   1. Point a DNS name at this machine and open ports 80 and 443 to it (docs/setup-guide.md walks through it).
#   2. docker compose up -d --build
#   3. docker compose exec cloud dotnet Yaparr.Cloud.dll accounts add you@example.com
#
# DOMAIN is cloud.yaparr.com unless .env says otherwise. Caddy is a separate service, so with a reverse proxy of your own instead, start only the
# service: "docker compose up -d --build cloud", and point your proxy at http://127.0.0.1:8080 (see SERVICE_BIND and SERVICE_PORT in .env.example).
# Service__BehindProxy stays true either way: the caller's address then comes from the proxy's X-Forwarded-For, which Caddy sets itself.

services:
  cloud:
    # The image CI publishes for each commit of master (deploy.sh sets IMAGE_TAG to the commit). "build" is the fallback: with --build, or when there is no
    # such image (a branch, or a machine that cannot reach ghcr.io), the image is built here and given this same name.
    image: ghcr.io/zburtle/yaparr-cloud:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      Service__BehindProxy: "true"
      # Service__PublicUrl: "https://cloud.yaparr.com"      # this service's address, for the signup links from "codes add" (this is the default in appsettings.json)
      # Service__SignupPageUrl: "https://yaparr.com/signup"  # the website page the links open (this is the default)
      # Service__MaxBlobBytes: "536870912"   # the largest backup, in bytes (512 MiB); Caddy allows a little more than this
      # Where accounts and signup codes are kept: empty is files in /data (as before); set SERVICE_DATABASE in .env, with COMPOSE_PROFILES=postgres, to use the
      # postgres container below (docs/setup-guide.md, "Moving to Postgres"). Backups and pictures are files unless S3_BUCKET is set (below).
      Service__Database: "${SERVICE_DATABASE:-}"
      # Where backups are kept: empty is files in /data (as before); with S3_BUCKET set they are objects in an S3-compatible bucket (Cloudflare R2, DigitalOcean
      # Spaces, MinIO): see docs/setup-guide.md, "Moving the backups to S3". The key should be able to read and write that one bucket only.
      Service__S3Endpoint: "${S3_ENDPOINT:-}"
      Service__S3Bucket: "${S3_BUCKET:-}"
      Service__S3AccessKey: "${S3_ACCESS_KEY:-}"
      Service__S3SecretKey: "${S3_SECRET_KEY:-}"
      Service__S3Region: "${S3_REGION:-auto}"
      Service__S3ConditionalWrites: "${S3_CONDITIONAL_WRITES:-true}"   # false for a store that does not take If-None-Match
      # true: refuse to start unless the database and the bucket are both set up, so nothing is ever quietly kept as files on this machine (pictures go in the bucket too).
      Service__RequireRemoteStorage: "${REQUIRE_REMOTE_STORAGE:-false}"
      # Push notifications through Firebase: the path, inside the container, of the service account key (README, "Push notifications"). Mount the file read-only
      # under volumes below, outside the repository. Empty: only UnifiedPush works.
      Service__PushFcmServiceAccountFile: "${PUSH_FCM_SERVICE_ACCOUNT_FILE:-}"
      # Paid plans (README, "Paid plans"): off while BILLING_PROVIDER is empty. The Polar secrets live in .env on the host, never in this file or the repository.
      Service__Billing__Provider: "${BILLING_PROVIDER:-}"
      Service__Billing__Polar__Server: "${POLAR_SERVER:-production}"
      Service__Billing__Polar__AccessToken: "${POLAR_ACCESS_TOKEN:-}"
      Service__Billing__Polar__WebhookSecret: "${POLAR_WEBHOOK_SECRET:-}"
      Service__Billing__Polar__CloudMonthlyProduct: "${POLAR_CLOUD_MONTHLY_PRODUCT:-}"
      Service__Billing__Polar__CloudYearlyProduct: "${POLAR_CLOUD_YEARLY_PRODUCT:-}"
      # Service__KeepVersions: "3"      # the newest versions always kept ...
      # Service__KeepDays: "7"          # ... and the newest of each of this many days
      # Service__WritesPerHour: "12"
      # Service__RequestsPerMinute: "120"
    volumes:
      - cloud-data:/data                     # the accounts, the signup codes and every backup: this is what to back up
      - ${PUSH_FCM_SERVICE_ACCOUNT_HOST_FILE:-/dev/null}:/run/secrets/fcm.json:ro   # the Firebase key, kept on the host outside the repository (set both PUSH_FCM_ variables in .env)
    depends_on:
      postgres:
        condition: service_healthy
        required: false                      # only when the postgres profile is on
    expose:
      - "8080"
    # Also on this computer only (127.0.0.1), for a proxy of your own or for looking at it from the machine itself. 0.0.0.0 would reach it from other
    # computers as plain http, which is not what you want with Caddy in front. SERVICE_PORT changes the port.
    ports:
      - "${SERVICE_BIND:-127.0.0.1}:${SERVICE_PORT:-8080}:8080"
    healthcheck:
      # bash, not the image's /bin/sh (dash), which has no /dev/tcp; the image has neither curl nor wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Accounts and signup codes, when SERVICE_DATABASE is set (and COMPOSE_PROFILES=postgres starts it). Small on purpose: it has to share a 1 GB machine with the rest.
  postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yaparr
      POSTGRES_USER: yaparr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}                # required when the profile is on: the container will not start without it
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB", "-c", "effective_cache_size=128MB"]
    mem_limit: 256m
    volumes:
      - pg-data:/var/lib/postgresql/data     # the accounts and codes: back this up too (pg_dump, see docs/setup-guide.md)
    expose:
      - "5432"                               # reachable by the service only: no port is published
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaparr -d yaparr"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      cloud:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"                # Caddy needs 80 and 443 reachable from the internet to get a certificate; change these only
      - "${HTTPS_PORT:-443}:443"             # when something in front forwards 80 and 443 to them
      - "${HTTPS_PORT:-443}:443/udp"         # http/3
    environment:
      DOMAIN: ${DOMAIN:-cloud.yaparr.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                     # the certificates: keep this, or Let's Encrypt is asked for new ones on every start
      - caddy-config:/config

volumes:
  pg-data:
  cloud-data:
  caddy-data:
  caddy-config:
